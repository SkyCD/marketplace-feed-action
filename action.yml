name: Generate marketplace feed
description: Generate static NuGet registration metadata and a SkyCD publisher manifest from GitHub releases
inputs:
  base-url:
    description: Public HTTPS URL of the site root
    required: true
  site-directory:
    description: Site directory to write to
    default: _site
  feed-subfolder:
    description: Optional path within the site directory for feed JSON
    default: ''
  package-id:
    description: NuGet package ID (defaults to the repository name)
    default: ''
  display-name:
    description: Marketplace display name override
    default: ''
  min-host-version:
    description: Lowest supported SkyCD host version
    default: '3.0.0'
  max-host-version:
    description: Highest supported SkyCD host version, when applicable
    default: ''
  token:
    description: GitHub token with repository contents read permission
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install generator dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
    - name: Generate static feed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_SITE_DIRECTORY: ${{ inputs.site-directory }}
        INPUT_FEED_SUBFOLDER: ${{ inputs.feed-subfolder }}
        INPUT_PACKAGE_ID: ${{ inputs.package-id }}
        INPUT_DISPLAY_NAME: ${{ inputs.display-name }}
        INPUT_MIN_HOST_VERSION: ${{ inputs.min-host-version }}
        INPUT_MAX_HOST_VERSION: ${{ inputs.max-host-version }}
      run: node "$GITHUB_ACTION_PATH/src/cli.js"
