name: Generate marketplace feed
description: Generate static NuGet registration metadata and a SkyCD publisher manifest from GitHub releases
inputs:
  base-url:
    description: Public HTTPS URL of the site root
    required: true
  site-directory:
    description: Site directory to write to
    default: _site
  feed-subfolder:
    description: Optional path within the site directory for feed JSON
    default: ''
  package-id:
    description: NuGet package ID (defaults to the repository name)
    default: ''
  display-name:
    description: Marketplace display name override
    default: ''
  min-host-version:
    description: Lowest supported SkyCD host version
    default: '3.0.0'
  max-host-version:
    description: Highest supported SkyCD host version, when applicable
    default: ''
  token:
    description: GitHub token with repository contents read permission
    default: ${{ github.token }}
runs:
  using: node24
  main: dist/index.js
